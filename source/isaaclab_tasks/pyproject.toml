[build-system]
requires = ["setuptools>=70.0,<82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isaaclab_tasks"
version = "30.1.0"
description = "Extension containing suite of environments for robot learning."
license = {text = "BSD-3-Clause"}
authors = [{name = "Isaac Lab Project Developers"}]
maintainers = [{name = "Isaac Lab Project Developers"}]
keywords = ["robotics", "rl", "il", "learning"]
requires-python = ">=3.12"
# Only interpackage dependencies should go here.
dependencies = [
    "isaaclab",
    "isaaclab_assets",
]

[project.optional-dependencies]
# Runtime dependencies for the optional local Kaolin development checkout.
# Install Kaolin itself explicitly; private source URLs must not enter wheel metadata.
simplicits = [
    "numpy", "Pillow>=8.0.0", "tqdm>=4.51.0", "scipy", "plyfile", "pygltflib", "warp-lang", "wget",
    "ipython", "ipycanvas", "ipyevents", "jupyter-client", "flask", "tornado", "comm>=0.1.3", "matplotlib",
]

[tool.uv.sources]
isaaclab = { path = "../isaaclab", editable = true }
isaaclab_assets = { path = "../isaaclab_assets", editable = true }

[project.urls]
Homepage = "https://github.com/isaac-sim/IsaacLab"
Repository = "https://github.com/isaac-sim/IsaacLab"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["isaaclab_tasks", "isaaclab_tasks.*"]

[tool.setuptools.package-data]
"*" = ["*.pyi"]
